name: mndgroup-dev

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: mndgroup
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  wp:
    image: wordpress:php8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8321:80"    # http://localhost:8321 (8080 a 80 používá lokální elvisek)
    volumes:
      - ./wp:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php:ro
      - ../theme/mndgroup:/var/www/html/wp-content/themes/mndgroup
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../plugins/mndgroup-core:/var/www/html/wp-content/plugins/mndgroup-core

  cli:
    image: wordpress:cli-php8.5
    profiles: ["cli"]
    user: "33:33"
    environment:
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./wp:/var/www/html
      - ./wp-config.php:/var/www/html/wp-config.php:ro
      - ../theme/mndgroup:/var/www/html/wp-content/themes/mndgroup
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../plugins/mndgroup-core:/var/www/html/wp-content/plugins/mndgroup-core

volumes:
  db-data:
