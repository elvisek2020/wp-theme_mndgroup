# Kontrola při každém pushi a pull requestu (a před vydáním).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntaxe PHP
        run: find theme plugins -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Syntaxe JS
        if: matrix.php == '8.4'
        run: find theme/mndgroup/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verze šablony = verze pluginu
        if: matrix.php == '8.4'
        run: |
          theme=$(grep -m1 -E '^Version:' theme/mndgroup/style.css | awk '{print $2}' | tr -d '\r')
          core=$(grep -m1 -E '^ \* Version:' plugins/mndgroup-core/mndgroup-core.php | awk '{print $3}' | tr -d '\r')
          const=$(sed -n "s/.*'MNDGROUP_CORE_VERSION', '\([^']*\)'.*/\1/p" plugins/mndgroup-core/mndgroup-core.php)
          echo "šablona $theme · plugin $core · konstanta $const"
          [ "$theme" = "$core" ] && [ "$core" = "$const" ] || { echo "::error::Verze nesouhlasí: šablona $theme, plugin $core, MNDGROUP_CORE_VERSION $const"; exit 1; }
