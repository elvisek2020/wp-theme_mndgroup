# Vydání: zvýšit verzi v theme/mndgroup/style.css i plugins/mndgroup-core/mndgroup-core.php,
# commit, pak tag vX.Y.Z. Workflow zkontroluje kód, sestaví mndgroup.zip a mndgroup-core.zip
# a vytvoří vydání se souborem update.json, ze kterého si weby berou aktualizace.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/ci.yml

  release:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Tag = verze šablony i pluginu
        run: |
          tag="${GITHUB_REF_NAME#v}"
          theme=$(grep -m1 -E '^Version:' theme/mndgroup/style.css | awk '{print $2}' | tr -d '\r')
          core=$(grep -m1 -E '^ \* Version:' plugins/mndgroup-core/mndgroup-core.php | awk '{print $3}' | tr -d '\r')
          [ "$tag" = "$theme" ] && [ "$tag" = "$core" ] || { echo "::error::Tag v$tag ≠ šablona $theme / plugin $core"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "REQUIRES=$(sed -n 's/^Requires at least:[[:space:]]*//p' theme/mndgroup/style.css | tr -d '\r')" >> "$GITHUB_ENV"
          echo "REQUIRES_PHP=$(sed -n 's/^Requires PHP:[[:space:]]*//p' theme/mndgroup/style.css | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Balíčky
        run: |
          (cd theme && zip -rq ../mndgroup.zip mndgroup -x '*/.DS_Store')
          (cd plugins && zip -rq ../mndgroup-core.zip mndgroup-core -x '*/.DS_Store')
          unzip -l mndgroup.zip | grep -q ' mndgroup/style.css$'
          unzip -l mndgroup-core.zip | grep -q ' mndgroup-core/mndgroup-core.php$'

      - name: update.json
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          jq -n \
            --arg version "$VERSION" \
            --arg url "$base/tag/v$VERSION" \
            --arg requires "$REQUIRES" \
            --arg requires_php "$REQUIRES_PHP" \
            --arg theme "$base/download/v$VERSION/mndgroup.zip" \
            --arg plugin "$base/download/v$VERSION/mndgroup-core.zip" \
            '{version: $version, url: $url, requires: $requires, requires_php: $requires_php, package: $theme, plugin: {slug: "mndgroup-core", package: $plugin}}' > update.json
          cat update.json

      - name: Vydání na GitHubu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mndgroup.zip mndgroup-core.zip update.json --title "MND Group $VERSION" --generate-notes --latest
