# Po pushnutí tagu vX.Y.Z sestaví mndgroup.zip (šablona) + mndgroup-core.zip (plugin) a vytvoří GitHub Release.
# WordPress (theme/mndgroup/inc/updater.php, plugins/mndgroup-core/inc/core.php) si pak aktualizaci najde sám.
name: Release šablony

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04  # pevně: ubuntu-latest se od 19. 10. 2026 přepne na Ubuntu 26 (jiné PHP); přechod udělat vědomě
    steps:
      - uses: actions/checkout@v5

      - name: Kontrola verze (tag = Version šablony i pluginu)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          THEME=$(grep -m1 -E '^Version:' theme/mndgroup/style.css | awk '{print $2}')
          CORE=$(grep -m1 -E '^ \* Version:' plugins/mndgroup-core/mndgroup-core.php | awk '{print $3}')
          echo "tag=$TAG theme=$THEME core=$CORE"
          if [ "$TAG" != "$THEME" ] || [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag v$TAG musí odpovídat Version ve style.css ($THEME) i v mndgroup-core.php ($CORE)"; exit 1
          fi

      - name: Kontrola syntaxe PHP
        run: find theme/mndgroup plugins/mndgroup-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Kontrola syntaxe PHP 7.4 (minimální verze v hlavičkách)
        run: docker run --rm -v "$PWD":/app -w /app php:7.4-cli sh -c "find theme/mndgroup plugins/mndgroup-core -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: Kontrola syntaxe JS
        run: find theme/mndgroup/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Sestavení ZIPů
        run: |
          (cd theme && zip -rq ../mndgroup.zip mndgroup -x '*/.DS_Store' -x 'mndgroup/README.md')
          (cd plugins && zip -rq ../mndgroup-core.zip mndgroup-core -x '*/.DS_Store')
          unzip -l mndgroup.zip | tail -1; unzip -l mndgroup-core.zip | tail -1

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mndgroup.zip
            mndgroup-core.zip
          generate_release_notes: true
